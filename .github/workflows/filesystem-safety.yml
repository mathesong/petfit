name: Filesystem safety

# The data definition cleanup deletes, so it has to classify every entry in an
# analysis folder correctly on every platform it runs on. The failure modes
# differ by OS -- POSIX symbolic links on Linux and macOS, NTFS junctions and
# symbolic links on Windows -- and a junction in particular presents to
# directory-walking code as an ordinary directory. Only a Windows runner can
# prove that case, so this matrix exists to run it.
#
# Deliberately narrow: the unit tests for subsetting_utils, not the container
# integration suite, which has no filesystem-classification content and costs
# far more to run three times over.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-safety:
    name: Cleanup safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::testthat

      - name: Run the filesystem safety tests
        run: |
          Rscript -e "devtools::load_all('.'); testthat::test_file('tests/testthat/test-subsetting_utils.R', stop_on_failure = TRUE)"

      # No separate confirmation that the junction test ran. Its only skip
      # condition is skip_if_not(.Platform$OS.type == "windows"), which cannot
      # fire on a Windows runner, and the step above already fails the job on
      # any failure. A second pass over the file would run every test twice to
      # prove something the skip condition already guarantees.
